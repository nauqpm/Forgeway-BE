$kind: http-request
name: Delete Task
url: '{{baseUrl}}/workspaces/{{workspaceKey}}/board/{{taskId}}'
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Task deleted", function () {
        pm.expect(pm.response.code).to.equal(204);
      });
order: 9000

