$kind: http-request
name: Get Board Tasks After Create
url: '{{baseUrl}}/workspaces/{{workspaceKey}}/board'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", function () {
        pm.expect(pm.response.code).to.equal(200);
      });

      const tasks = pm.response.json();
      pm.test("Created task exists in board", function () {
        pm.expect(tasks).to.be.an("array");
        const task = tasks.find((item) => item.id === pm.environment.get("taskId"));
        pm.expect(task, "created task").to.exist;
        pm.expect(task.key).to.equal(pm.environment.get("taskKey"));
      });
order: 8000

