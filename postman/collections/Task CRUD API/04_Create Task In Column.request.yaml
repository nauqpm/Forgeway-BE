$kind: http-request
name: Create Task In Column
url: '{{baseUrl}}/workspaces/{{workspaceKey}}/board'
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "title": "{{taskTitle}}",
      "type": "{{taskType}}",
      "priority": "{{taskPriority}}",
      "columnId": "{{taskColumnId}}",
      "storyPoints": {{taskStoryPoints}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Task created", function () {
        pm.expect(pm.response.code).to.equal(201);
      });

      const task = pm.response.json();
      pm.test("Task has generated key and column", function () {
        pm.expect(task).to.have.property("id").that.is.a("string").and.not.empty;
        pm.expect(task).to.have.property("key").that.is.a("string").and.not.empty;
        pm.expect(task.key).to.match(new RegExp(`^${pm.environment.get("workspaceKey")}-\\d+$`));
        pm.expect(task).to.have.property("columnId", pm.environment.get("taskColumnId"));
      });

      pm.environment.set("taskId", task.id);
      pm.environment.set("taskKey", task.key);
order: 4000

