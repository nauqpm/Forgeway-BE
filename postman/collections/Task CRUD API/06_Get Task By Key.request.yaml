$kind: http-request
name: Get Task By Key
url: '{{baseUrl}}/workspaces/{{workspaceKey}}/board/key/{{taskKey}}'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", function () {
        pm.expect(pm.response.code).to.equal(200);
      });

      const task = pm.response.json();
      pm.test("Task key matches environment", function () {
        pm.expect(task.key).to.equal(pm.environment.get("taskKey"));
      });
order: 6000

