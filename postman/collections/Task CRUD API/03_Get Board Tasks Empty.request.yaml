$kind: http-request
name: Get Board Tasks Empty
url: '{{baseUrl}}/workspaces/{{workspaceKey}}/board'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", function () {
        pm.expect(pm.response.code).to.equal(200);
      });

      const tasks = pm.response.json();
      pm.test("Board tasks response is array", function () {
        pm.expect(tasks).to.be.an("array");
      });
order: 3000

