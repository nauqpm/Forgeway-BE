$kind: http-request
name: Get Task By ID
url: '{{baseUrl}}/workspaces/{{workspaceKey}}/board/{{taskId}}'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", function () {
        pm.expect(pm.response.code).to.equal(200);
      });

      const task = pm.response.json();
      pm.test("Task id matches environment", function () {
        pm.expect(task.id).to.equal(pm.environment.get("taskId"));
      });
order: 5000

