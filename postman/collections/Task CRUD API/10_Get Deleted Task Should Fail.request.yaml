$kind: http-request
name: Get Deleted Task Should Fail
url: '{{baseUrl}}/workspaces/{{workspaceKey}}/board/{{taskId}}'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Deleted task is not found", function () {
        pm.expect(pm.response.code).to.equal(404);
      });

      pm.environment.set("taskId", "");
      pm.environment.set("taskKey", "");
order: 10000

