$kind: http-request
name: Create Kanban Task In Todo Column
url: '{{baseUrl}}/workspaces/{{kanbanWorkspaceKey}}/board'
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "title": "{{taskTitle}}",
      "type": "task",
      "priority": "{{taskPriority}}",
      "columnId": "todo",
      "storyPoints": {{taskStoryPoints}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Kanban task created", function () {
        pm.expect(pm.response.code).to.equal(201);
      });

      const task = pm.response.json();
      pm.test("Task is in todo column with todo status", function () {
        pm.expect(task.id).to.be.a("string").and.not.empty;
        pm.expect(task.key).to.match(new RegExp(`^${pm.environment.get("kanbanWorkspaceKey")}-\\d+$`));
        pm.expect(task.columnId).to.equal("todo");
        pm.expect(task.status).to.equal("todo");
      });

      pm.environment.set("kanbanTaskId", task.id);
      pm.environment.set("kanbanTaskKey", task.key);
order: 4000

