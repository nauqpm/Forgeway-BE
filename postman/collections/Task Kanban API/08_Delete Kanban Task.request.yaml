$kind: http-request
name: Delete Kanban Task
url: '{{baseUrl}}/workspaces/{{kanbanWorkspaceKey}}/board/{{kanbanTaskId}}'
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Kanban task deleted", function () {
        pm.expect(pm.response.code).to.equal(204);
      });
order: 8000

