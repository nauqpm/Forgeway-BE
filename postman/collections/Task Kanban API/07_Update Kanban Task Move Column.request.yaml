$kind: http-request
name: Update Kanban Task Move Column
url: '{{baseUrl}}/workspaces/{{kanbanWorkspaceKey}}/board/{{kanbanTaskId}}'
method: PATCH
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "title": "{{taskUpdatedTitle}}",
      "columnId": "inprogress",
      "priority": "high"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Kanban task updated", function () {
        pm.expect(pm.response.code).to.equal(200);
      });

      const task = pm.response.json();
      pm.expect(task.id).to.equal(pm.environment.get("kanbanTaskId"));
      pm.expect(task.columnId).to.equal("inprogress");
      pm.expect(task.status).to.equal("in-progress");
order: 7000

