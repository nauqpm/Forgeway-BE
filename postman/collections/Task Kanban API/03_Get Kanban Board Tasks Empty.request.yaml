$kind: http-request
name: Get Kanban Board Tasks Empty
url: '{{baseUrl}}/workspaces/{{kanbanWorkspaceKey}}/board'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", function () {
        pm.expect(pm.response.code).to.equal(200);
      });

      pm.test("Response is array", function () {
        pm.expect(pm.response.json()).to.be.an("array");
      });
order: 3000

