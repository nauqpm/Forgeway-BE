$kind: http-request
name: Delete Kanban Task Permanently
url: '{{baseUrl}}/workspaces/{{kanbanWorkspaceKey}}/board/{{kanbanTaskId}}'
method: DELETE
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "confirmText": "delete"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Kanban task permanently deleted by soft-delete", function () {
        pm.expect(pm.response.code).to.equal(204);
      });
order: 11000

