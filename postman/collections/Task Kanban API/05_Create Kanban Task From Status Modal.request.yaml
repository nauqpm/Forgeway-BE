$kind: http-request
name: Create Kanban Task From Status Modal
url: '{{baseUrl}}/workspaces/{{kanbanWorkspaceKey}}/board'
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "title": "Kanban task from modal",
      "type": "bug",
      "priority": "high",
      "status": "in-progress"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Kanban modal task created", function () {
        pm.expect(pm.response.code).to.equal(201);
      });

      const task = pm.response.json();
      pm.test("Status maps to inprogress column", function () {
        pm.expect(task.status).to.equal("in-progress");
        pm.expect(task.columnId).to.equal("inprogress");
      });
order: 5000

