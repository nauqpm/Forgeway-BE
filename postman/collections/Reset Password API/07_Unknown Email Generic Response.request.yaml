$kind: http-request
name: Unknown Email Generic Response
url: '{{baseUrl}}/auth/request-password-reset'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "unknown-reset-user@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Unknown email still returns accepted response", function () {
        pm.expect(pm.response.code).to.equal(201);
      });

      const data = pm.response.json();
      pm.test("Generic response preserved", function () {
        pm.expect(data).to.have.property("success", true);
        pm.expect(data).to.have.property("message");
      });
order: 7000
