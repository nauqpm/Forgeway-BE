$kind: http-request
name: Invalid Reset Grant Should Fail
url: '{{baseUrl}}/auth/reset-password'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "resetGrant": "invalid-reset-grant",
      "newPassword": "{{resetPasswordNew}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Invalid reset grant is rejected", function () {
        pm.expect([400, 401]).to.include(pm.response.code);
      });

      const data = pm.response.json();
      pm.test("Error response returned", function () {
        pm.expect(data).to.have.property("message");
      });
order: 6000
