$kind: http-request
name: Request Password Reset OTP
url: '{{baseUrl}}/auth/request-password-reset'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{resetPasswordEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Password reset request accepted", function () {
        pm.expect(pm.response.code).to.equal(201);
      });

      const data = pm.response.json();
      pm.test("Generic reset response returned", function () {
        pm.expect(data).to.have.property("success", true);
        pm.expect(data).to.have.property("message");
      });
order: 1000
