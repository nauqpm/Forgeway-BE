$kind: http-request
name: Verify Password Reset OTP
url: "{{baseUrl}}/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{resetPasswordEmail}}",
      "otp": "924947"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("OTP verified", function () {
        pm.expect(pm.response.code).to.equal(201);
      });

      const data = pm.response.json();
      pm.test("Reset grant returned", function () {
        pm.expect(data).to.have.property("success", true);
        pm.expect(data).to.have.property("resetGrant").that.is.a("string").and.not.empty;
        pm.expect(data).to.have.property("expiresIn");
      });

      pm.environment.set("resetGrant", data.resetGrant);
      pm.environment.set("consumedResetGrant", "");
    language: text/javascript
order: 2000
