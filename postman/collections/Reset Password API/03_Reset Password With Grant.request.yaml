$kind: http-request
name: Reset Password With Grant
url: '{{baseUrl}}/auth/reset-password'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "resetGrant": "{{resetGrant}}",
      "newPassword": "{{resetPasswordNew}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Password reset with grant successful", function () {
        pm.expect(pm.response.code).to.equal(201);
      });

      const data = pm.response.json();
      pm.test("Reset success response returned", function () {
        pm.expect(data).to.have.property("success", true);
        pm.expect(data).to.have.property("message");
      });

      pm.environment.set("consumedResetGrant", pm.environment.get("resetGrant"));
      pm.environment.set("verifyPassword", pm.environment.get("resetPasswordNew"));
      pm.environment.set("resetGrant", "");
order: 3000
