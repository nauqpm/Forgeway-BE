$kind: http-request
name: Get Scrum Board Tasks
url: '{{baseUrl}}/workspaces/{{scrumWorkspaceKey}}/board'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", function () {
        pm.expect(pm.response.code).to.equal(200);
      });

      const tasks = pm.response.json();
      pm.expect(tasks).to.be.an("array");
      pm.expect(tasks.some((task) => task.id === pm.environment.get("scrumTaskId"))).to.equal(true);
order: 6000

