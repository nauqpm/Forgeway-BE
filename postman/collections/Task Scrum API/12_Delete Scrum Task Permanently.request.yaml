$kind: http-request
name: Delete Scrum Task Permanently
url: '{{baseUrl}}/workspaces/{{scrumWorkspaceKey}}/board/{{scrumTaskId}}'
method: DELETE
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "confirmText": "delete"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Scrum task permanently deleted by soft-delete", function () {
        pm.expect(pm.response.code).to.equal(204);
      });
order: 12000

