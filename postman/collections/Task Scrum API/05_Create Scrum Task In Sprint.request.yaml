$kind: http-request
name: Create Scrum Task In Sprint
url: '{{baseUrl}}/workspaces/{{scrumWorkspaceKey}}/board'
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "title": "Scrum sprint story",
      "type": "story",
      "priority": "high",
      "status": "todo",
      "sprintId": "{{sprintId}}",
      "storyPoints": 8
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Scrum sprint task created", function () {
        pm.expect(pm.response.code).to.equal(201);
      });

      const task = pm.response.json();
      pm.expect(task.status).to.equal("todo");
      pm.expect(task.sprintId).to.equal(pm.environment.get("sprintId"));
order: 5000

