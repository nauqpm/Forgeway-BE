$kind: http-request
name: Create Scrum Workspace
url: '{{baseUrl}}/workspaces'
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "name": "{{scrumWorkspaceName}}",
      "description": "Created from Task Scrum API collection",
      "type": "scrum"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Scrum workspace created", function () {
        pm.expect(pm.response.code).to.equal(201);
      });

      const workspace = pm.response.json();
      pm.expect(workspace).to.have.property("_id");
      pm.expect(workspace).to.have.property("key").that.is.a("string").and.not.empty;
      pm.expect(workspace).to.have.property("type", "scrum");

      pm.environment.set("scrumWorkspaceId", workspace._id);
      pm.environment.set("scrumWorkspaceKey", workspace.key);
order: 2000

