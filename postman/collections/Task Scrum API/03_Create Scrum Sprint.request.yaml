$kind: http-request
name: Create Scrum Sprint
url: '{{baseUrl}}/workspaces/{{scrumWorkspaceKey}}/scrum/sprints'
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "goal": "{{sprintGoal}}",
      "startDate": "{{sprintStartDate}}",
      "endDate": "{{sprintEndDate}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Sprint created", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      const sprint = pm.response.json();
      pm.expect(sprint).to.have.property("_id");
      pm.environment.set("sprintId", sprint._id);
order: 3000

