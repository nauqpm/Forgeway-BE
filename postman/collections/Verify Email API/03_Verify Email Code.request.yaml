$kind: http-request
name: Verify Email Code
url: "{{baseUrl}}/auth/verify-email"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{verifyEmail}}",
      "code": "107194"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Email verification status 200", function () {
        pm.expect(pm.response.code).to.equal(200);
      });

      const data = pm.response.json();
      pm.test("Email verified", function () {
        pm.expect(data).to.have.property("success", true);
        pm.expect(data).to.have.property("message");
      });
    language: text/javascript
order: 3000
