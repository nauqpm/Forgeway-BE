$kind: http-request
name: Register Account For Verification
url: '{{baseUrl}}/auth/register'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{verifyEmail}}",
      "password": "{{verifyPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Register request accepted", function () {
        pm.expect([200, 201]).to.include(pm.response.code);
      });

      const data = pm.response.json();
      pm.test("Generic registration response returned", function () {
        pm.expect(data).to.have.property("success", true);
        pm.expect(data).to.have.property("message");
      });
order: 1000