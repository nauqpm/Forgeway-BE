when:
  - event: [push, pull_request, manual]
    branch: [dev, production]

steps:
  test-and-build:
    image: node:20
    commands:
      - npm ci
      - npm run lint
      - npm run test -- --passWithNoTests --forceExit --coverage --coverageReporters=text-summary
      - npm run build

  docker-build-dry-run:
    image: woodpeckerci/plugin-docker
    privileged: true
    settings:
      mtu: 1400
      dry_run: true
      repo: ghcr.io/automationland-dev/sdlc-platform-backend
      tags: latest
    when:
      - event: [push, pull_request, manual]
        branch: dev
      - event: pull_request
        branch: production

  docker-build-and-push:
    image: woodpeckerci/plugin-docker
    privileged: true
    settings:
      mtu: 1400
      registry: ghcr.io
      repo: ghcr.io/automationland-dev/sdlc-platform-backend
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
    when:
      - event: push
        branch: production

  deploy-to-vps:
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: vps_host
      username:
        from_secret: vps_user
      password:
        from_secret: vps_password
      envs:
        - vps_ghcr_pat
        - CI_REPO_OWNER
      script:
        - echo $vps_ghcr_pat | docker login ghcr.io -u $CI_REPO_OWNER --password-stdin
        - cd /opt/sdlc
        - docker pull ghcr.io/automationland-dev/sdlc-platform-backend:latest
        - docker compose up -d --no-build --no-deps backend
        - docker image ls "ghcr.io/automationland-dev/sdlc-platform-backend" --format "{{.Repository}}:{{.Tag}}" | grep "sha-" | sort -r | tail -n +3 | xargs docker rmi 2>/dev/null || true
        - |
          for i in $(seq 1 18); do
            CONTAINER=$(docker compose ps -q backend 2>/dev/null | head -1)
            STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER" 2>/dev/null)
            RESTARTS=$(docker inspect --format='{{.RestartCount}}' "$CONTAINER" 2>/dev/null)
            HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER" 2>/dev/null)
            
            if [ "${RESTARTS:-0}" -gt 0 ]; then
              echo "DEPLOY FAILED: backend restarted ${RESTARTS} time(s) - crash loop detected"
              docker compose logs --tail=30 backend
              exit 1
            fi
            if [ "$STATUS" = "running" ] && [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "Backend deployed OK and healthy (restarts=0, attempt=$i): $(date)"
              exit 0
            fi
            echo "Waiting... attempt $i/18 (status=${STATUS:-unknown}, health=${HEALTH_STATUS:-unknown})"
            sleep 5
          done
          echo "DEPLOY FAILED: backend did not reach healthy state after 90s"
          docker compose logs --tail=30 backend
          exit 1
    when:
      - event: [push, manual]
        branch: production
