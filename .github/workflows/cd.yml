name: CD — Deploy Backend

on:
  push:
    branches: [production]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/al-task-backend

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/sdlc
            docker pull ghcr.io/${{ github.repository_owner }}/al-task-backend:latest
            docker compose up -d --no-build --no-deps backend
            docker image ls "ghcr.io/${{ github.repository_owner }}/al-task-backend" \
              --format "{{.Repository}}:{{.Tag}}" | grep "sha-" | sort -r | \
              tail -n +3 | xargs docker rmi 2>/dev/null || true
            sleep 20
            CONTAINER=$(docker compose ps -q backend 2>/dev/null | head -1)
            STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER" 2>/dev/null)
            if [ "$STATUS" != "running" ]; then
              echo "DEPLOY FAILED: backend is ${STATUS:-not found}"
              docker compose logs --tail=30 backend
              exit 1
            fi
            echo "Backend deployed OK: $(date)"
