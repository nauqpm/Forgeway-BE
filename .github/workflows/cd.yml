name: CD — Deploy Backend

on:
  push:
    branches: [production]

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'ghcr.io/nauqpm/forgeway-be' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sdlc' }}
  SERVICE_NAME: ${{ vars.DEPLOY_SERVICE || 'backend' }}
  HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:7071/health' }}

# Serialize backend deploys; do not cancel in progress so it can finish or roll back safely.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write # Required for keyless Cosign signing with GitHub OIDC.

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy is report-only; change exit-code to 1 after reviewing real scan results.
      - name: Scan pushed image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign image with Cosign keyless
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          echo "Signing image digest: $IMAGE_REF"
          cosign sign --yes "$IMAGE_REF" 2>&1 | tee cosign-sign.log
          REKOR_URL="$(grep -Eo 'https://[^[:space:]]*(rekor|search.sigstore.dev)[^[:space:]]*' cosign-sign.log | tail -1 || true)"
          echo "Rekor transparency log: ${REKOR_URL:-https://rekor.sigstore.dev}"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Verify image signature
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/cd.yml@${{ github.ref }}
        run: |
          set -Eeuo pipefail
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            "$IMAGE_REF"
          echo "Verified image signature: $IMAGE_REF"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          VPS_GHCR_PAT: ${{ secrets.VPS_GHCR_PAT }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USERNAME,VPS_GHCR_PAT,IMAGE_NAME,DIGEST,DEPLOY_PATH,SERVICE_NAME,HEALTH_URL
          script: |
            set -Eeuo pipefail

            trap 'echo "DEPLOY FAILED at line $LINENO"' ERR

            echo "Starting backend deployment..."

            # Fail clearly when a GitHub secret was not provided.
            : "${GHCR_USERNAME:?GHCR_USERNAME secret is missing}"
            : "${VPS_GHCR_PAT:?VPS_GHCR_PAT secret is missing}"
            : "${IMAGE_NAME:?IMAGE_NAME is missing}"
            : "${DIGEST:?DIGEST is missing}"
            : "${DEPLOY_PATH:?DEPLOY_PATH is missing}"

            retry() {
              local attempts="$1" delay="$2" attempt=1
              shift 2

              until "$@"; do
                if [ "$attempt" -ge "$attempts" ]; then
                  return 1
                fi
                echo "Command failed, retrying in ${delay}s ($attempt/$attempts)"
                sleep "$delay"
                attempt=$((attempt + 1))
              done
            }

            login_ghcr() {
              printf '%s' "$VPS_GHCR_PAT" |
                docker login ghcr.io \
                  --username "$GHCR_USERNAME" \
                  --password-stdin
            }

            echo "Authenticating with GHCR..."

            retry 3 5 login_ghcr

            cd "$DEPLOY_PATH"

            # ponytail: global VPS deploy lock; split per service only if parallel deploys are required.
            exec 9>"$DEPLOY_PATH/.deploy.lock"
            flock 9

            LAST_GOOD_DIGEST_FILE="$DEPLOY_PATH/.last-good-digest-backend"
            COMPOSE_ENV_FILE="$DEPLOY_PATH/.env"
            CURRENT_IMAGE_ID=""
            PREVIOUS_IMAGE_ID=""
            CONTAINER_WAIT_ATTEMPTS=18
            CONTAINER_WAIT_INTERVAL_SECONDS=5
            HTTP_CHECK_ATTEMPTS=5
            HTTP_CHECK_INTERVAL_SECONDS=4
            HTTP_TIMEOUT_SECONDS=5

            update_compose_image() {
              if grep -q '^BACKEND_IMAGE=' "$COMPOSE_ENV_FILE"; then
                sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$1|" "$COMPOSE_ENV_FILE"
              else
                printf 'BACKEND_IMAGE=%s\n' "$1" >> "$COMPOSE_ENV_FILE"
              fi
            }

            cleanup_old_images() {
              local image_name="$1" current_image_id="$2" previous_image_id="$3"
              local image_ref="" image_id="" running_image_ids=""

              echo "Docker image cleanup for $image_name"
              echo "Keeping current image ID: ${current_image_id:-none}"
              echo "Keeping previous image ID: ${previous_image_id:-none}"

              running_image_ids="$(docker ps -q 2>/dev/null | while read -r container_id; do
                docker inspect --format '{{.Image}}' "$container_id" 2>/dev/null || true
              done || true)"
              while read -r image_ref image_id; do
                [ -n "$image_id" ] || continue
                if [ "$image_id" = "$current_image_id" ] || { [ -n "$previous_image_id" ] && [ "$image_id" = "$previous_image_id" ]; }; then
                  echo "Keeping: $image_ref ($image_id)"
                  continue
                fi

                if printf '%s\n' "$running_image_ids" | grep -Fxq "$image_id"; then
                  echo "::warning::Skipping image in use by a running container: $image_ref ($image_id)"
                  continue
                fi

                echo "Removing: $image_ref ($image_id)"
                if docker rmi "$image_id" >/dev/null 2>&1; then
                  echo "OK: removed $image_ref ($image_id)"
                else
                  echo "::warning::FAILED: could not remove $image_ref ($image_id)"
                fi
              done < <(docker images --no-trunc --format '{{.Repository}}@{{.Digest}} {{.ID}}' | awk -v prefix="$image_name@" 'index($0, prefix) == 1 && !seen[$2]++')
              echo "Skipping dangling-image prune: no repository-specific label is configured"
            }

            # Compose parses every service, so both digest-pinned image variables must exist.
            if ! grep -Eq '^BACKEND_IMAGE=.+@sha256:[0-9a-f]{64}$' "$COMPOSE_ENV_FILE" || \
               ! grep -Eq '^FRONTEND_IMAGE=.+@sha256:[0-9a-f]{64}$' "$COMPOSE_ENV_FILE"; then
              echo "DEPLOY FAILED: $COMPOSE_ENV_FILE must contain valid BACKEND_IMAGE and FRONTEND_IMAGE digests"
              exit 1
            fi

            wait_for_container() {
              local expected_image_id="$1"

              echo "Waiting for backend container..."

              for i in $(seq 1 "$CONTAINER_WAIT_ATTEMPTS"); do
              CONTAINER="$(
                docker compose ps -q "$SERVICE_NAME" 2>/dev/null |
                  head -1
              )"

              if [ -z "$CONTAINER" ]; then
                echo "Waiting... attempt $i/$CONTAINER_WAIT_ATTEMPTS (container not created)"
                sleep "$CONTAINER_WAIT_INTERVAL_SECONDS"
                continue
              fi

              STATUS="$(
                docker inspect \
                  --format='{{.State.Status}}' \
                  "$CONTAINER"
              )"

              RESTARTS="$(
                docker inspect \
                  --format='{{.RestartCount}}' \
                  "$CONTAINER"
              )"

              ACTUAL_IMAGE_ID="$(
                docker inspect \
                  --format='{{.Image}}' \
                  "$CONTAINER"
              )"

              HEALTH_STATUS="$(
                docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                  "$CONTAINER"
              )"

              if [ "${RESTARTS:-0}" -gt 0 ]; then
                echo "DEPLOY FAILED: backend restarted ${RESTARTS} time(s)"
                return 1
              fi

              if [ "$STATUS" = "running" ]; then
                if [ "$ACTUAL_IMAGE_ID" != "$expected_image_id" ]; then
                  echo "DEPLOY FAILED: backend is running an old image"
                  echo "Expected image: $expected_image_id"
                  echo "Actual image:   $ACTUAL_IMAGE_ID"
                  return 1
                fi

                if [ "$HEALTH_STATUS" != "healthy" ]; then
                  echo "Waiting... attempt $i/$CONTAINER_WAIT_ATTEMPTS (health=$HEALTH_STATUS)"
                  sleep "$CONTAINER_WAIT_INTERVAL_SECONDS"
                  continue
                fi

                echo "Backend container matches expected image on attempt $i"
                return 0
              fi

              if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                echo "DEPLOY FAILED: container status is $STATUS"
                return 1
              fi

              echo "Waiting... attempt $i/$CONTAINER_WAIT_ATTEMPTS (status=$STATUS)"
              sleep "$CONTAINER_WAIT_INTERVAL_SECONDS"
              done

              echo "DEPLOY FAILED: backend did not become healthy after 90s"
              return 1
            }

            check_health() {
              for i in $(seq 1 "$HTTP_CHECK_ATTEMPTS"); do
                if curl -fsS --max-time "$HTTP_TIMEOUT_SECONDS" "$HEALTH_URL"; then
                  echo "Backend health endpoint passed on attempt $i"
                  return 0
                fi

                echo "Waiting for backend health endpoint... attempt $i/$HTTP_CHECK_ATTEMPTS"
                sleep "$HTTP_CHECK_INTERVAL_SECONDS"
              done

              return 1
            }

            verify_deployment() {
              wait_for_container "$1" && check_health
            }

            CURRENT_CONTAINER="$(docker compose ps -q "$SERVICE_NAME" 2>/dev/null | head -1 || true)"
            if [ -n "$CURRENT_CONTAINER" ]; then
              if CURRENT_IMAGE_ID="$(docker inspect --format='{{.Image}}' "$CURRENT_CONTAINER" 2>/dev/null)" && \
                 verify_deployment "$CURRENT_IMAGE_ID"; then
                CURRENT_IMAGE_REF="$(docker image inspect "$CURRENT_IMAGE_ID" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F -m1 "$IMAGE_NAME@" || true)"
                CURRENT_DIGEST="${CURRENT_IMAGE_REF#"$IMAGE_NAME@"}"

                if [ "$CURRENT_DIGEST" != "$CURRENT_IMAGE_REF" ] && [[ "$CURRENT_DIGEST" = sha256:* ]]; then
                  printf '%s\n' "$CURRENT_DIGEST" > "$LAST_GOOD_DIGEST_FILE"
                  echo "Saved current backend digest for rollback: $CURRENT_DIGEST"
                else
                  echo "Current backend digest is unavailable; preserving any existing rollback target"
                fi
              else
                echo "Current backend is not healthy; preserving any existing rollback target"
              fi
            fi
            PREVIOUS_IMAGE_ID="$CURRENT_IMAGE_ID"

            TARGET_IMAGE="$IMAGE_NAME@$DIGEST"
            echo "Pulling backend image by digest..."
            retry 3 5 docker pull "$TARGET_IMAGE"
            EXPECTED_IMAGE_ID="$(docker image inspect "$TARGET_IMAGE" --format '{{.Id}}')"

            echo "Validating Docker Compose configuration..."
            if update_compose_image "$TARGET_IMAGE" && \
               docker compose config --quiet && \
               docker compose config --images "$SERVICE_NAME" | grep -Fxq "$TARGET_IMAGE" && \
               { echo "Starting backend container..."; docker compose up -d --no-build --no-deps "$SERVICE_NAME"; } && \
               verify_deployment "$EXPECTED_IMAGE_ID"; then
              printf '%s\n' "$DIGEST" > "$LAST_GOOD_DIGEST_FILE"
              echo "Backend deployed successfully"
              echo "Image ID: $EXPECTED_IMAGE_ID"
              echo "Digest: $DIGEST"
              echo "Time: $(date)"
              cleanup_old_images "$IMAGE_NAME" "$EXPECTED_IMAGE_ID" "$PREVIOUS_IMAGE_ID" || \
                echo "::warning::Docker image cleanup failed unexpectedly"
              exit 0
            fi

            echo "DEPLOY FAILED: new backend image did not become healthy"
            docker compose logs --tail=100 "$SERVICE_NAME" || true

            if [ ! -s "$LAST_GOOD_DIGEST_FILE" ]; then
              echo "ROLLBACK FAILED: no last known-good backend digest is available"
              exit 1
            fi

            ROLLBACK_DIGEST="$(tr -d '\r\n' < "$LAST_GOOD_DIGEST_FILE")"
            if [[ "$ROLLBACK_DIGEST" != sha256:* ]]; then
              echo "ROLLBACK FAILED: invalid digest in $LAST_GOOD_DIGEST_FILE"
              exit 1
            fi

            # Application rollback does not rollback database state.
            # Schema changes must remain backward-compatible and follow
            # an expand-and-contract migration strategy.
            ROLLBACK_IMAGE="$IMAGE_NAME@$ROLLBACK_DIGEST"
            echo "Rolling back backend to $ROLLBACK_DIGEST..."
            if update_compose_image "$ROLLBACK_IMAGE" && \
               { docker image inspect "$ROLLBACK_IMAGE" >/dev/null 2>&1 || retry 3 5 docker pull "$ROLLBACK_IMAGE"; } && \
               ROLLBACK_IMAGE_ID="$(docker image inspect "$ROLLBACK_IMAGE" --format '{{.Id}}')" && \
               docker compose up -d --no-build --no-deps "$SERVICE_NAME" && \
               verify_deployment "$ROLLBACK_IMAGE_ID"; then
              echo "Rollback completed successfully"
              cleanup_old_images "$IMAGE_NAME" "$ROLLBACK_IMAGE_ID" "$PREVIOUS_IMAGE_ID" || \
                echo "::warning::Docker image cleanup failed unexpectedly"
              echo "::warning::Deploy failed but rollback succeeded; backend is running the previous digest"
              exit 1
            fi

            echo "ROLLBACK FAILED: backend did not become healthy"
            docker compose ps "$SERVICE_NAME"
            docker compose logs --tail=100 "$SERVICE_NAME"
            exit 1
