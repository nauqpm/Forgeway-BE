name: CD — Deploy Backend

on:
  push:
    branches: [production]

env:
  IMAGE_NAME: ghcr.io/automationland-dev/sdlc-platform-backend

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.VPS_GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/sdlc
            docker pull ghcr.io/automationland-dev/sdlc-platform-backend:latest
            docker compose up -d --no-build --no-deps backend
            docker image ls "ghcr.io/automationland-dev/sdlc-platform-backend" \
              --format "{{.Repository}}:{{.Tag}}" | grep "sha-" | sort -r | \
              tail -n +3 | xargs docker rmi 2>/dev/null || true
            for i in $(seq 1 18); do
              CONTAINER=$(docker compose ps -q backend 2>/dev/null | head -1)
              STATUS=$(docker inspect --format='{{.State.Status}}' "$CONTAINER" 2>/dev/null)
              RESTARTS=$(docker inspect --format='{{.RestartCount}}' "$CONTAINER" 2>/dev/null)
              if [ "${RESTARTS:-0}" -gt 0 ]; then
                echo "DEPLOY FAILED: backend restarted ${RESTARTS} time(s) — crash loop detected"
                docker compose logs --tail=50 backend
                exit 1
              fi
              if [ "$STATUS" = "running" ]; then
                echo "Backend deployed OK (restarts=0, attempt=$i): $(date)"
                exit 0
              fi
              echo "Waiting... attempt $i/18 (status=${STATUS:-unknown})"
              sleep 5
            done
            echo "DEPLOY FAILED: backend did not reach running state after 90s"
            docker compose logs --tail=50 backend
            exit 1
